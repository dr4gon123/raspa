name: Check FortiOS releases

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly check: Mondays 06:00 UTC
    - cron: "0 7 1 * *" # Monthly full pass: 1st of the month 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-fortios-releases
  cancel-in-progress: false

jobs:
  check-and-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for new FortiOS releases
        id: check
        run: python check_new_versions.py --update-config --github-output

      - name: Run scrapers
        # Full pass on the monthly schedule and manual dispatches so pages that
        # failed in earlier runs get backfilled; weekly runs scrape new releases only.
        if: steps.check.outputs.count != '0' || github.event.schedule == '0 7 1 * *' || github.event_name == 'workflow_dispatch'
        run: |
          python scrape_cli_ref.py
          python scrape_log_ref.py

      - name: Commit and push
        if: steps.check.outputs.count != '0' || github.event.schedule == '0 7 1 * *' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit — no missing pages found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add -A
          if [ '${{ steps.check.outputs.count }}' != '0' ]; then
            git commit -m "feat: scrape FortiOS ${{ steps.check.outputs.display }}"
          else
            git commit -m "fix: backfill missing scraped pages"
          fi
          # The run may take ~20 min; rebase in case main moved meanwhile.
          git pull --rebase origin main
          git push

      - name: Write job summary
        if: always()
        run: |
          if [ "${{ steps.check.outcome }}" != "success" ]; then
            echo "Release check failed — see logs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          count='${{ steps.check.outputs.count }}'
          if [ "$count" = "0" ]; then
            echo "No new FortiOS releases found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### New FortiOS releases scraped" >> "$GITHUB_STEP_SUMMARY"
            echo '${{ steps.check.outputs.new_versions }}' \
              | python3 -c 'import json, sys; [print(f"- FortiOS {v}") for v in json.load(sys.stdin)]' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
